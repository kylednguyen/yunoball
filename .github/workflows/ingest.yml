name: Ingest nflverse

on:
  schedule:
    - cron: "0 10 * * 2" # Tuesdays 10:00 UTC, after MNF stats land
  workflow_dispatch:
    inputs:
      season:
        description: "Season to ingest (default: the season in progress)"
        required: false

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Schema first, so a column added in the same release lands before the
      # rows that fill it. Then the season in progress — nflverse republishes
      # its files all season (new weeks, stat corrections) and the runner has
      # no download cache, so every run reads the current release. A season
      # passed to workflow_dispatch reloads that one instead.
      - run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
      - run: pnpm ingest:nfl ${{ inputs.season && format('--season {0}', inputs.season) || '--current' }}
        env:
          DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}

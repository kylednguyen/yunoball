name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgresql://yunoball:yunoball@localhost:5432/yunoball

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: yunoball
          POSTGRES_PASSWORD: yunoball
          POSTGRES_DB: yunoball
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U yunoball" --health-interval 5s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm knip
      - run: pnpm --filter @yunoball/server test
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://yunoball:yunoball@localhost:5432/yunoball

  web-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: yunoball
          POSTGRES_PASSWORD: yunoball
          POSTGRES_DB: yunoball
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U yunoball" --health-interval 5s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      # Real nflverse data, the whole warehouse — the same shape production
      # runs on. The suite asserts career-spanning facts (Brady's 23 seasons,
      # Manning's 2013 record) that a three-season window cannot produce, and
      # a narrower CI warehouse would only prove the UI works on data no user
      # will ever see. ~8 minutes. The per-play table is the one step that
      # costs as much again (~18 s a season), and the suite only draws one
      # 2024 game, so it loads that season alone.
      - run: pnpm ingest:nfl --all --skip plays
      - run: pnpm ingest:nfl --season 2024 --only plays
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      # The suite runs against the production build, not `next dev` — see the
      # webServer note in playwright.config.ts. The origin is baked in at build
      # time and the build refuses to run without one.
      - run: pnpm build:web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
      # Playwright boots both servers itself (playwright.config.ts webServer):
      # the Express API on :4000 and `next start` on :3000.
      - run: pnpm e2e
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:web
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid # build-time smoke value; Vercel injects the real one

  <text x="392" y="494" font-family="var(--font)" font-size="10" fill="var(--faint)">bound params · read-only role</text>

  <text x="194" y="593" font-family="var(--font)" font-size="9.5" fill="var(--faint)">query_audit · answer_cache · stat_facts · fact_of_the_day</text>

  <line x1="150" y1="558" x2="174" y2="558" stroke="var(--faint)" stroke-width="1.4" marker-end="url(#yb-arw-faint)"/>

  <!-- ── scheduled writer: fact miner ────────────────────────────────── -->

  <text x="622" y="580" font-family="var(--font)" font-size="9.5" fill="var(--faint)">→ coverage floors</text>
  <text x="622" y="594" font-family="var(--font)" font-size="9.5" fill="var(--faint)">→ stat_facts</text>
  <text x="622" y="612" font-family="var(--font)" font-size="9" fill="var(--faint)">after ingest · daily pick</text>
  <line x1="610" y1="558" x2="586" y2="558" stroke="var(--faint)" stroke-width="1.4" marker-end="url(#yb-arw-faint)"/>
</svg>
<figcaption>The lime path is one <code>POST /api/search</code>: the browser calls Express, the controller hands the question straight to the engine, and only <em>execute</em> touches Postgres — a cache hit returns before that and an unparseable question leaves via the refusal exit, while the ingest and the fact miner write to the same warehouse on their own schedules, outside any request.</figcaption>
